[project]
name = "blitz"
version = "0.1.0"
description = "Every Puzzle Project blitz: claim crossword scans, review their OCR (with Claude or by hand), send the reviews"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "wordfreq>=3",
]

[project.optional-dependencies]
site = ["boto3>=1.34"]  # publishing to the review site's bucket (R2, S3-compatible)

[project.scripts]
blitz = "blitz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blitz"]
