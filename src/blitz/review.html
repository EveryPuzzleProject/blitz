<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review watch</title>
<style>
:root{--bg:#f7f5f0;--panel:#fff;--ink:#1d1d1b;--muted:#6b6860;--line:#e2ded4;--accent:#b4501e;--look:#1f6fd1;--fix:#c2410c;--hot:#d97706;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--panel:#211f1c;--ink:#ece8df;--muted:#a19c90;--line:#38342e;--accent:#e08a5a;--look:#6aa8ff;--fix:#fb923c;--hot:#facc15;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0}.muted{color:var(--muted)}.counts span{margin-right:10px}
.wrap{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 46px)}
@media (max-width:800px){.wrap{grid-template-columns:1fr;height:auto}}
nav{border-right:1px solid var(--line);overflow:auto}
.p{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.p:hover{background:var(--panel)}.p.sel{background:var(--panel);box-shadow:inset 3px 0 var(--accent)}
.chip{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap;height:fit-content}
.s-to{color:var(--warn)}.s-checked{color:var(--ok)}.s-flagged{color:var(--bad)}
.s-waiting{color:var(--muted)}.s-looking{color:var(--look)}.s-writing{color:var(--warn)}.s-ready{color:var(--ok)}.s-needs{color:var(--warn)}.s-escalated{color:var(--bad)}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
main{overflow:auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin:10px 0 8px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lbl button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:1px 7px;cursor:pointer}
.lbl button.on{border-color:var(--accent)}
.viewer{position:relative;overflow:hidden;height:70vh;min-height:360px;background:#888;border-radius:4px;cursor:grab;touch-action:none}
.viewer.drag{cursor:grabbing}
.hl.peek{border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);z-index:3}
.ctx{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;max-height:48%;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);padding:8px 12px;font-size:13px;cursor:default}
.ctx h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.ctx h4 span{font-weight:400;color:var(--muted);font-size:12px}
.ctx .row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:4px 6px;border-radius:4px;align-items:baseline}
.ctx .row.me{background:color-mix(in srgb,var(--hot) 22%,transparent)}.ctx .row .id{font-weight:600}
.ctx .row .st{font-size:11px;color:var(--muted);white-space:nowrap}.ctx .row .st.ok{color:var(--ok)}.ctx .row .st.warn{color:var(--warn)}.ctx .row .st.bad{color:var(--bad)}
.card .acts button.ctxb{color:var(--muted)}
.tip{position:absolute;z-index:5;max-width:360px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:6px 9px;font-size:13px;pointer-events:none}
.tip.pinned{pointer-events:auto;border-color:var(--accent)}
.tip .st{font-size:11px;color:var(--muted);margin-top:3px}.tip .st.ok{color:var(--ok)}.tip .st.warn{color:var(--warn)}.tip .st.bad{color:var(--bad)}
.moved{font-size:12px;margin-top:3px;color:var(--ok)}.moved.warn{color:var(--warn);font-weight:600}.moved.meh{color:var(--muted)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.small{position:relative}.small img{display:block;width:100%}
.hl{position:absolute;border:2px solid var(--look);background:color-mix(in srgb,var(--look) 12%,transparent);pointer-events:none;border-radius:2px}
.hl.fix{border-color:var(--fix);background:color-mix(in srgb,var(--fix) 15%,transparent)}
.hl.hot{border-color:var(--hot);border-width:3px;background:color-mix(in srgb,var(--hot) 30%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 40%,transparent);z-index:2}
.hl.dim{opacity:.15}
.cards{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow:auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer}
.card:hover{border-color:var(--hot)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.card b{font-size:12px;color:var(--muted);font-weight:600}
.card .acts{float:right;display:flex;gap:4px}.card .acts button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:0 7px;cursor:pointer}
.card .acts button.on.ok{border-color:var(--ok);color:var(--ok)}.card .acts button.on.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.card.acc{border-left:4px solid var(--ok)}.card.rej{border-color:var(--bad);border-left:4px solid var(--bad)}.card.rej .body{text-decoration:line-through;opacity:.7}
.card .why{width:100%;margin-top:4px;font:inherit;font-size:12px;padding:2px 5px;border:1px solid var(--bad);border-radius:4px;background:var(--panel);color:var(--ink)}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 2px;font-size:13px}.verdict button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:3px 10px;cursor:pointer}
.verdict button.on.good{border-color:var(--ok);color:var(--ok);font-weight:600}.verdict button.on.bad{border-color:var(--bad);color:var(--bad);font-weight:600}.verdict input{flex:1;min-width:180px;font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
.mark{font-size:12px;margin-left:4px}
.answ{font:600 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1px 4px;margin-left:4px;color:var(--ink)}
.answ ins{text-decoration:none;color:var(--ok)}
.small .hl.hot{background:color-mix(in srgb,var(--hot) 55%,transparent)}
del{color:var(--bad)}ins{color:var(--ok);text-decoration:none;font-weight:600}
.sheets{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.sheets img{height:150px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;background:#fff}
.feed{font-size:13px;margin:0;padding-left:0;list-style:none}.feed li{margin:2px 0;padding:3px 6px;border-radius:4px}
.feed li[data-ev]{cursor:default}.feed li[data-ev]:hover{background:color-mix(in srgb,var(--hot) 20%,transparent)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom img{max-width:95vw;max-height:95vh;background:#fff}
label{font-size:13px}
.board{display:grid;grid-template-columns:repeat(var(--cols),1fr);border:2px solid #111;width:min(100%,520px);aspect-ratio:var(--cols)/var(--rows);background:#111;gap:1px}
.cell{background:#fff;color:#111;position:relative;display:flex;align-items:flex-end;justify-content:center;font:600 clamp(9px,1.6vw,17px)/1 Georgia,serif;padding-bottom:6%}
.cell.blk{background:#111}.cell .num{position:absolute;left:2px;top:1px;font:9px/1 system-ui,sans-serif;color:#444}
.cell.chg{background:#fde7c7}.cell .unk{color:#999}
.preview{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.preview{grid-template-columns:1fr}}
.cl{columns:2 260px;font-size:13px}.cl h4{margin:0 0 4px}.cl ol{list-style:none;margin:0 0 10px;padding:0}.cl li{margin:1px 0;break-inside:avoid}
.cl li.chg{background:color-mix(in srgb,var(--hot) 22%,transparent);border-radius:3px}.cl .n{display:inline-block;min-width:26px;font-weight:600}
.cl .ans{color:var(--muted);font-size:11px;margin-left:6px;letter-spacing:.04em}
pre.xd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:60vh;font-size:12px;white-space:pre}
.hint{font-size:12px;color:var(--muted)}
#auth input:disabled{opacity:.4;cursor:not-allowed;background:var(--bg)}
.howto{padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;background:var(--panel)}.howto b{font-weight:600}
.tip .rep{display:flex;gap:6px;margin-top:6px}.tip .rep input{flex:1;font:inherit;font-size:12px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.tip .rep button{font:inherit;font-size:12px;border:1px solid var(--accent);background:var(--bg);color:var(--ink);border-radius:4px;cursor:pointer}
.tip .reported{font-size:12px;color:var(--warn);margin-top:4px}
/* the checkup: grade and warnings */
.g-check{color:var(--bad)}.g-look{color:var(--warn)}.g-clean{color:var(--ok)}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:currentColor;vertical-align:middle}
.checkup{margin:8px 0}.checkup .gh{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px}
.checkup .fact.high{border-left-color:var(--bad)}.checkup .fact.medium{border-left-color:var(--warn)}.checkup .fact.info{border-left-color:var(--look)}
.checkup details{margin:4px 0;font-size:13px}.checkup summary{cursor:pointer;color:var(--muted)}
.checkup .fact .sq{border-color:currentColor;font-size:12px}
/* facts about this puzzle that a checker needs up front */
.fact{margin:8px 0;padding:7px 11px;border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:6px;background:var(--panel);font-size:13px}
.fact.info{border-left-color:var(--look)}.fact.bad{border-left-color:var(--bad)}
.fact b.t{font-weight:700}.fact .sq{display:inline-block;margin:0 2px;padding:0 6px;border:1px solid var(--warn);border-radius:9px;text-decoration:none;color:var(--ink);cursor:pointer}
.fact .sq:hover{background:color-mix(in srgb,var(--hot) 25%,transparent)}
/* year filter at the top of the list */
.yf{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.yf select{flex:1;min-width:0;font:inherit;font-size:13px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
/* reactions */
.rx{position:relative;display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.rx button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:1px 8px;cursor:pointer;line-height:1.5}
.rx button:hover{border-color:var(--accent)}.rx button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.rx .rxchip{animation:rxpop .25s ease-out}
@keyframes rxpop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.rxpal{position:absolute;left:0;top:100%;margin-top:4px;z-index:8;display:grid;grid-template-columns:repeat(6,auto);gap:2px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.rxpal[hidden]{display:none}
.rx .rxpal button{border:0;border-radius:6px;background:none;font-size:20px;padding:3px 6px}.rx .rxpal button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
/* the welcome tour */
#tourbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:1px 10px;cursor:pointer}
#tour{position:fixed;inset:0;z-index:20}
#tour .dm{position:fixed;background:rgba(0,0,0,.6)}
#tour .hole{position:fixed;border-radius:8px;outline:3px solid var(--accent);pointer-events:none}
#tour .hole.none{outline:0;left:50%;top:50%;width:0;height:0}
#tour .tcard{position:fixed;width:min(400px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:16px 18px;font-size:14px}
#tour h2{margin:0 0 6px;font-size:17px}#tour p{margin:6px 0}#tour .step{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#tour .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
#tour .foot .btns{display:flex;gap:8px;margin-left:auto}
#tour .foot label{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
#tour .foot button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 12px;cursor:pointer}
#tour .foot button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#tour .dots{display:flex;gap:5px;margin:10px 0 0}#tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}#tour .dots i.on{background:var(--accent)}
#tour kbd{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--bg)}
</style></head><body>
<header><h1 id="h1">Review watch: <span id="root"></span></h1><span class="counts" id="counts"></span>
<label id="followl"><input type="checkbox" id="follow" checked> follow the latest activity</label><button id="tourbtn" type="button" hidden title="Show the welcome tour">? Tour</button><span id="auth" style="margin-left:auto"></span></header>
<div id="howto" class="howto" hidden></div>
<div class="wrap"><nav><div class="yf" id="yf" hidden></div><div id="list"></div></nav><main id="main"><p class="muted">Waiting for reviews…</p></main></div>
<div class="zoom" id="zoom"><img alt="contact sheet"></div>
<script src="puzzle.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Where the data comes from. Local (blitz watch): the watch server's API. The public site sets
// window.BLITZ_API (site.js) before this script: puzzles from storage, decisions to the database.
const API = window.BLITZ_API || {
  mode: 'local', pollMs: 2000,
  state: async () => (await fetch('api/state')).json(),
  puzzle: async x => (await fetch('api/puzzle?x=' + encodeURIComponent(x))).json(),
  decide: async (x, payload) => {
    const r = await fetch('api/decide', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({x, ...payload})});
    return r.ok ? r.json() : null;
  },
  file: (x, path) => `${x}/${path}`,
};
// A helper checking the review sees no agent internals. ?helper on the local page shows that view.
const HELPER = API.mode === 'site' || new URLSearchParams(location.search).has('helper');
const HOWTO = `<b>How to help:</b> an AI read each of these 1920s–30s crosswords from a scanned page and
      corrected what it could. Check its work against the scan: for each change on the right, press
      <b>✓</b> if the scan agrees, <b>✗</b> if it doesn't (and say what the scan shows). Point at any clue on the
      scan to see how it was transcribed; click it to report a mistake nobody caught. When you've been through the
      changes, mark the puzzle <b>Looks right</b> or <b>Needs work</b>. Keys: J/K next/previous, A accept, R reject. We open the puzzles that have had the fewest checks first: a second opinion is as welcome as a first.`;
let S = null, sel = null, P = null, tab = 'review', pageImg = 'page.jpg', hot = null, focusCrops = null;
const view = {};  // per puzzle and page: {s, x, y, fit}
const ago = t => { const s = Math.max(0, Math.round(S.now - t)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)} min ago` : `${Math.round(s/3600)} h ago`; };
const chip = st => `<span class="chip s-${st.split(' ')[0]} ${['looking','writing'].includes(st) ? 'live' : ''}">${esc(st)}</span>`;
// A helper's view of a puzzle: is it theirs to check, or done? (The agent's own status is for the
// maintainer's page: its "ready" means the agent thinks the puzzle is ready to publish.)
const HSTATES = {'to check': 's-to', 'checked ✓': 's-checked', 'needs work': 's-flagged'};
const helperState = p => p.verdict === 'looks-right' ? 'checked ✓' : p.verdict === 'needs-work' ? 'needs work' : 'to check';
const hchip = p => { const st = helperState(p); return `<span class="chip ${HSTATES[st]}">${esc(st)}</span>`; };
const label = it => it.replace(/^clue:/, '').replace(/^cell:/, 'key square ').replace(/^grid:/, 'grid square ').replace(/^meta:/, '').replace(/^other:/, 'caption ');

// The runs of words a change took out of a clue (e.g. text that belongs to another clue).
function removedRuns(a, b) {
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean), n = A.length, m = B.length;
  const L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  // Walk the diff, pairing each run of deleted words with the words inserted in its place. A run
  // replaced by about as many words is a misread fixed in place ("algo" -> "also"), not removed text.
  const runs = []; let i = 0, j = 0, del = [], ins = [];
  const flush = () => { if (del.length) runs.push({run: del.join(' '), words: del.length, swapped: ins.length >= del.length - 1 && ins.length > 0}); del = []; ins = []; };
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { flush(); i++; j++; }
    else if (j < m && (i >= n || L[i][j+1] >= L[i+1][j])) { ins.push(B[j]); j++; }
    else { del.push(A[i]); i++; }
  }
  flush();
  return runs;
}
const norm = t => ' ' + String(t).toLowerCase().split(/\s+/).filter(w => !/\d/.test(w)).join(' ')
  .replace(/[^a-z]+/g, ' ').replace(/ +/g, ' ').trim() + ' ';
function finalText(id) {  // a clue as it will be published: the OCR's text with the review's (accepted) fix
  const k = 'clue:' + id, fx = P.review.corrections || {};
  return k in fx && !rejected(k) ? fx[k] : ((O().clues[id] || {}).text || '');
}
const STOP = new Set(('the and for you this that with what are was his her its not but from your they them have has had who how when where will would can one '
  + 'some also very more most just like only than then been into over much such each other about after before were there their these those').split(' '));
function whereItWent(id, was, now) {
  const out = [];
  for (const {run, words, swapped} of removedRuns(was, now)) {
    const n = norm(run);
    if (norm(run).trim().length < 3 && !/\d/.test(run)) continue;  // punctuation, a stray letter
    if (!n.trim()) { out.push(`<div class="moved meh">“${esc(run)}” removed (a page or clue number)</div>`); continue; }
    if (/solution|last week/.test(n)) { out.push(`<div class="moved meh">“${esc(run)}” removed (a heading)</div>`); continue; }
    // Moved text is often still misread where it was cut from ("deuees", "bold" for "boid"):
    // a clue holds it when it has most of its words, as corrected or as the OCR read them.
    const toks = n.trim().split(' ').filter(w => w.length > 2 && !STOP.has(w));
    const holds = k => {
      const ws = new Set((norm(finalText(k)) + norm((O().clues[k] || {}).text || '')).trim().split(' '));
      return toks.length === 1 ? toks[0].length >= 4 && ws.has(toks[0])
        : toks.filter(w => ws.has(w)).length >= Math.max(2, Math.ceil(0.6 * toks.length));
    };
    const hits = toks.length ? Object.keys(O().clues).filter(k => k !== id && holds(k)) : [];
    if (hits.length) out.push(`<div class="moved">“${esc(run)}” is in ${hits.map(esc).join(', ')}</div>`);
    else if (!swapped) out.push(`<div class="moved warn">“${esc(run)}” was taken out and isn't in any other clue: lost text?</div>`);
  }
  return out.join('');
}
function wordDiff(a, b) {

let ctxOpen = true;  // on by default; Enter or Hide turns it off (remembered in this browser)
try { ctxOpen = localStorage.getItem('watch-context') !== 'off'; } catch (e) {}
function setCtx(on) { ctxOpen = on; try { localStorage.setItem('watch-context', on ? 'on' : 'off'); } catch (e) {} showContext(); }
function ctxRow(id, me) {
  const was = (O().clues[id] || {}).text || '', now = finalText(id), [st, cls] = clueStatus(id);
  return `<div class="row ${me ? 'me' : ''}"><span class="id">${esc(id)}</span><span>${now === was ? esc(now || '(no text)') : wordDiff(was, now)}${answerHtml(id)}</span><span class="st ${cls}">${esc(st)}</span></div>`;
}
const HIDE = '<span>J/K next change · <a href="#" data-hide>Hide</a> (Enter shows it again)</span>';
function contextHtml(item) {
  const i = item.indexOf(':'), kind = item.slice(0, i), key = item.slice(i + 1), cl = O().clues;
  if (kind === 'clue' && cl[key] !== undefined) {  // the clues printed around it
    const ids = Object.keys(cl).filter(k => k[0] === key[0]).sort((a, b) => +a.slice(1) - +b.slice(1)), at = ids.indexOf(key);
    return `<h4>${esc(key)} and the clues around it ${HIDE}</h4>`
      + ids.slice(Math.max(0, at - 2), at + 3).map(k => ctxRow(k, k === key)).join('');
  }
  const m = /^r(\d+)c(\d+)$/.exec(key);
  if ((kind === 'cell' || kind === 'grid') && m) {  // the entries that cross the square
    const r = +m[1] - 1, c = +m[2] - 1;
    const ids = Object.keys(cl).filter(k => entrySquares(k).some(([rr, cc]) => rr === r && cc === c));
    return `<h4>The entries through square ${esc(key)} ${HIDE}</h4>`
      + (ids.length ? ids.map(k => ctxRow(k, false)).join('') : '<p class="muted">No entry crosses this square (a black square).</p>');
  }
  return `<h4>${esc(label(item))} ${HIDE}</h4><p class="muted">No clue context for this change.</p>`;
}
function showContext() {
  const vw = $('#viewer'); if (!vw) return;
  vw.querySelectorAll('.ctx').forEach(e => e.remove());
  const cs = [...document.querySelectorAll('.card')];
  if (!ctxOpen || focusCard === null || !cs[focusCard]) return;
  const d = document.createElement('div'); d.className = 'ctx';
  d.innerHTML = contextHtml(cs[focusCard].dataset.item);
  ['pointerdown', 'wheel', 'dblclick'].forEach(ev => d.addEventListener(ev, e => e.stopPropagation()));
  d.querySelector('[data-hide]')?.addEventListener('click', e => { e.preventDefault(); setCtx(false); });
  vw.appendChild(d);
}
function moveFocus(i) {
  const cs = [...document.querySelectorAll('.card')];
  if (!cs.length) return;
  focusCard = Math.min(cs.length - 1, Math.max(0, i));
  cs.forEach(c => c.classList.remove('sel'));
  cs[focusCard].classList.add('sel');
  cs[focusCard].scrollIntoView({block: 'nearest'});
  setHot(cs[focusCard].dataset.item, true);
  showContext();
}
function changesHtml() {
  const rv = P.review, o = O(), cards = [];
  for (const [item, now] of Object.entries(rv.corrections || {})) {
    const i = item.indexOf(':'), kind = item.slice(0, i), key = item.slice(i + 1);
    let was = '';
    if (kind === 'clue') was = (o.clues[key] || {}).text || '';
    else if (kind === 'meta') was = o[key] || '';
    else if (kind === 'other') was = (o.captions || {})[key] || '';
    else if (kind === 'cell') { const m = /r(\d+)c(\d+)/.exec(key); was = m && o.answers ? (o.answers[m[1]-1] || '')[m[2]-1] || '' : ''; }
    else if (kind === 'grid') { const m = /r(\d+)c(\d+)/.exec(key); was = m ? (o.grid[m[1]-1] || '')[m[2]-1] || '' : ''; }
    const body = kind === 'cell' || kind === 'grid' ? `<del>${esc(was || '?')}</del> → <ins>${esc(now)}</ins>`
      : now === '' ? `<del>${esc(was || '(removed)')}</del> <span class="muted">(removed)</span>` : wordDiff(was, now)
        + (kind === 'clue' && was ? whereItWent(key, was, now) : '');
    cards.push(card(item, item, label(item), body));
  }
  for (const [k, v] of Object.entries(rv.sic || {})) cards.push(card('clue:' + k, 'sic:' + k, k + ': kept as printed (sic)', 'meant: ' + esc(v)));
  for (const [k, v] of Object.entries(rv.unsure || {})) cards.push(`<div class="card" data-item="${esc(k)}"><b>${esc(label(k))}: unsure</b><br>${esc(v)}</div>`);
  return cards.join('');
}

function xdText(Z) {  // the corrected puzzle as xd (a preview: the archive's own export is made upstream)
  const m = /(\d{4}-\d\d-\d\d)/.exec(Z.id), head = [['Title', Z.title], ['Author', Z.author], ['Byline', Z.byline], ['Date', m ? m[1] : ''], ['Source', Z.source]];
  const grid = Z.cells.map(row => row.map(x => !x ? '#' : x.sol || '.').join(''));
  const ans = w => w.cells.map(([r, c]) => (Z.cells[r][c] || {}).sol || '.').join('');
  const list = d => Z.words.filter(w => w.dir === d).map(w => `${d}${w.n}. ${w.text} ~ ${ans(w)}`).join('\n');
  return head.filter(h => h[1]).map(h => `${h[0]}: ${h[1]}`).join('\n') + '\n\n\n' + grid.join('\n') + '\n\n\n' + list('A') + '\n\n' + list('D') + '\n';
}

function previewHtml() {
  if (typeof buildPuzzle !== 'function') return '<p class="muted">The preview needs docs/puzzle.js from the blitz repository.</p>';
  const rv = {...P.review, corrections: Object.fromEntries(Object.entries(P.review.corrections || {}).filter(([k]) => !rejected(k))),
              sic: Object.fromEntries(Object.entries(P.review.sic || {}).filter(([k]) => !rejected('sic:' + k)))};
  const Z = buildPuzzle(O(), rv);
  if (!Z) return '<p class="muted">No preview.</p>';
  const corr = Object.keys(rv.corrections);
  const changedSq = new Set(corr.filter(k => k.startsWith('cell:') || k.startsWith('grid:')).map(k => k.slice(5)));
  const changedClue = new Set(corr.filter(k => k.startsWith('clue:')).map(k => k.slice(5)));
  const board = Z.cells.map((row, r) => row.map((x, c) => !x ? '<div class="cell blk"></div>'
    : `<div class="cell ${changedSq.has(`r${r+1}c${c+1}`) ? 'chg' : ''}">${x.num ? `<span class="num">${x.num}</span>` : ''}${x.sol ? esc(x.sol) : '<span class="unk">·</span>'}</div>`).join('')).join('');
  const ans = w => w.cells.map(([r, c]) => (Z.cells[r][c] || {}).sol || '·').join('');
  const list = d => Z.words.filter(w => w.dir === d).map(w => `<li class="${changedClue.has(w.id) ? 'chg' : ''}"><span class="n">${w.n}</span>${esc(w.text)}<span class="ans">${esc(ans(w))}</span></li>`).join('');
  return `<p class="hint">${P.review._draft ? 'From the draft (not finished yet). ' : ''}The puzzle with this review applied (less any change you rejected), as its record page will show it. Changed squares and clues are tinted.</p>
    <div class="preview"><div><h2 style="margin:0 0 2px;font:600 20px Georgia,serif">${esc(Z.title)}</h2>
      <div class="muted" style="margin-bottom:8px">${esc(Z.byline || Z.author)} · ${esc(Z.date)}</div>
      <div class="board" style="--cols:${Z.C};--rows:${Z.R}">${board}</div></div>
      <div class="cl"><h4>Across</h4><ol>${list('A')}</ol><h4>Down</h4><ol>${list('D')}</ol></div></div>
    <h3>xd</h3><pre class="xd">${esc(xdText(Z))}</pre>`;
}

// Things a checker should know before looking at anything else: a grid the reviewer changed (rare, and it changes
// the numbering) and a puzzle with no answer key (the answers can't be checked).
function checkupHtml() {
  const cu = P.review.checkup, ws = cu.warnings || [], big = ws.filter(w => w.level !== 'info'), notes = ws.filter(w => w.level === 'info');
  const item = it => /^(clue:)?[AD]\d+$/.test(it) || /^r\d+c\d+$/.test(it) || /^(grid|cell|entry):/.test(it)
    ? `<a class="sq" href="#" data-hot="${esc(/^[AD]\d+$/.test(it) ? 'clue:' + it : /^r\d+c\d+$/.test(it) ? 'grid:' + it : it)}">${esc(it.replace(/^clue:/, ''))}</a>` : '';
  const row = w => `<div class="fact ${w.level}">${esc(w.text)} ${(w.items || []).slice(0, 8).map(item).join(' ')}</div>`;
  return `<div class="checkup"><div class="gh"><span class="chip g-${cu.grade}"><span class="gdot"></span>${GRADE_NAME[cu.grade]}</span>`
    + `<span class="muted">${big.length ? `${big.length} thing${big.length === 1 ? '' : 's'} to know before you start` : 'nothing unusual'}</span></div>`
    + big.map(row).join('')
    + (notes.length ? `<details><summary>${notes.length} note${notes.length === 1 ? '' : 's'}</summary>${notes.map(row).join('')}</details>` : '') + `</div>`;
}

function factsHtml() {
  if (P.review.checkup) return checkupHtml();
  const o = O(), fx = P.review.corrections || {}, out = [];
  const was0 = k => { const m = /^grid:r(\d+)c(\d+)$/.exec(k); return ((o.grid[m[1] - 1] || '')[m[2] - 1]) || '.'; };
  // only squares the reviewer really changed (a correction equal to what the OCR read changes nothing)
  const g = Object.keys(fx).filter(k => /^grid:r\d+c\d+$/.test(k) && (was0(k) === '#') !== (fx[k] === '#'));
  if (g.length) {
    const sq = g.map(k => {
      const m = /^grid:r(\d+)c(\d+)$/.exec(k), was = ((o.grid[m[1] - 1] || '')[m[2] - 1]) || '.';
      return `<a class="sq" href="#" data-gridfix="${esc(k)}" title="show this square">r${m[1]}c${m[2]}: ${was === '#' ? 'black' : 'white'} → ${fx[k] === '#' ? 'black' : 'white'}</a>`;
    }).join(' ');
    const gc = P.review.grid_check;
    out.push(`<div class="fact ${gc ? 'bad' : ''}"><b class="t">The reviewer changed the grid:</b> ${sq}. That is rare and it changes the numbering, so check each square against the scan
      (the numbers printed in the grid should line up with the entries).${gc ? ` <b style="color:var(--bad)">The numbering gets worse with this fix: ${esc((gc.created || []).join(', '))}
      would have no printed clue.</b>` : ''}</div>`);
  }
  if (!o.answers) out.push(`<div class="fact info"><b class="t">No answer key.</b> The answers for this puzzle weren't found (they were often printed in a later issue),
    so they can't be checked: only the clues, the grid and the numbering are here.</div>`);
  return out.join('');
}

      + rxHtml()

      + (HELPER ? `<button id="nextbtn" title="Open the puzzle that has had the fewest checks so far">Next puzzle →</button>` : '')
      + `<span class="hint">J/K next/previous change · A accept · R reject (then type why) · U undo · Enter: show or hide the context</span></div>` : ''}
    <div class="tabs"><button data-tab="review" class="${tab === 'review' ? 'on' : ''}">The review</button><button data-tab="preview" class="${tab === 'preview' ? 'on' : ''}">The result (grid and xd)</button></div>
    ${tab === 'preview' ? previewHtml() : `

        <span>${pages.length > 1 ? pages.map(n => `<button data-page="${n}" class="${n === pageImg ? 'on' : ''}">${n === 'page.jpg' ? 'Page' : 'Clue page'}</button>`).join(' ') : ''} <button id="fit">Fit</button></span></div>
        <div class="viewer" id="viewer"><div class="stage" id="stage"><img id="pageimg" src="${esc(imgSrc(pageImg))}" alt="scanned page" draggable="false"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:10px">

  };

  bindReactions();
  document.querySelectorAll('[data-hot]').forEach(a => a.onclick = e => {
    e.preventDefault();
    if (tab !== 'review') { tab = 'review'; renderMain(); }

  document.querySelectorAll('input[data-note]').forEach(box => {
    box.onclick = e => e.stopPropagation();
    box.onkeydown = e => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        const i = [...document.querySelectorAll('.card')].indexOf(box.closest('.card'));
        const save = e.key === 'Enter' && box.value !== (D().notes[box.dataset.note] || '');
        (save ? decide({item: box.dataset.note, decision: 'reject', note: box.value}) : Promise.resolve()).then(() => moveFocus(i + 1));
      }
    };
    box.onchange = () => decide({item: box.dataset.note, decision: 'reject', note: box.value});
  });
  const cs = document.querySelectorAll('.card');
  if (focusCard !== null && cs[focusCard]) cs[focusCard].classList.add('sel');
  const pg = document.getElementById('progress'); if (pg) pg.textContent = progress();
  showContext();
  document.querySelectorAll('.feed li[data-ev]').forEach(li => {
    const e = P.events[+li.dataset.ev];
    li.onmouseenter = () => { focusCrops = e.crops || null; redraw(); };
    li.onmouseleave = () => { focusCrops = null; redraw(); };
  });
  document.querySelectorAll('.sheets img').forEach(im => im.onclick = () => { $('#zoom img').src = im.src; $('#zoom').style.display = 'flex'; });
  for (const [id, fn] of [['pageimg', drawPage], ['gridimg', () => drawSmall('gridimg', 'grid.png')], ['ansimg', () => drawSmall('ansimg', 'answers.png')]]) {
    const im = document.getElementById(id); if (im) { if (im.complete) fn(); else im.onload = fn; }
  }
  bindViewer();
}


// ---- reactions: a little emoji on a puzzle, like Slack or Discord (helper mode) ----
const RX_EMOJI = ['👍', '🎉', '😄', '🤔', '😮', '🧩', '🕰️', '🤓', '🔥', '❤️', '🙈', '👀'];
const LOCAL_RX = {  // no database (a local preview): kept in this browser, so the counts are just yours
  read() { try { return JSON.parse(localStorage.getItem('blitz-rx') || '{}'); } catch (e) { return {}; } },
  async get(x) { const mine = this.read()[x] || []; return {counts: Object.fromEntries(mine.map(e => [e, 1])), mine}; },
  async toggle(x, e) {
    const all = this.read(), m = new Set(all[x] || []);
    m.has(e) ? m.delete(e) : m.add(e); all[x] = [...m];
    try { localStorage.setItem('blitz-rx', JSON.stringify(all)); } catch (er) {}
    return this.get(x);
  },
};
const RX = API.reactions || LOCAL_RX;
function rxHtml() {  // between the verdict buttons and the note
  const r = P.reactions; if (!HELPER || !r) return '';
  const seen = RX_EMOJI.concat(Object.keys(r.counts).filter(e => !RX_EMOJI.includes(e))).filter(e => r.counts[e] > 0);
  return `<span class="rx">${seen.map(e => `<button class="rxchip ${r.mine.includes(e) ? 'on' : ''}" data-rx="${esc(e)}" `
    + `title="${r.mine.includes(e) ? 'You reacted: click to take it back' : 'React too'}">${e} ${r.counts[e]}</button>`).join('')}`
    + `<button id="rxadd" title="Add a reaction" aria-label="Add a reaction">☺＋</button>`
    + `<span class="rxpal" id="rxpal" hidden>${RX_EMOJI.map(e => `<button data-rx="${esc(e)}">${e}</button>`).join('')}</span></span>`;
}
function bindReactions() {
  const add = $('#rxadd'); if (!add) return;
  add.onclick = e => { e.stopPropagation(); $('#rxpal').hidden = !$('#rxpal').hidden; };
  document.querySelectorAll('.rx [data-rx]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const r = await RX.toggle(P.xdid, b.dataset.rx);
    if (r) { P.reactions = r; lastKey = renderKey(P); renderMain(); }
  });
}
document.addEventListener('click', e => { const pal = $('#rxpal'); if (pal && !pal.hidden && !e.target.closest('.rx')) pal.hidden = true; });

      <b>needs eyes</b> means nobody has checked it yet. The tag on each row shows where you are with it. We open the puzzles with the fewest checks first, and a second opinion on one someone has already checked is just as welcome.</p>`},
  {h: 'Look at the scan', tab: 'review', sel: ['#scanpanel'], html: () => `<p>This is the original scanned page. <b style="color:var(--look)">Blue</b> boxes are what the AI looked at,
      <b style="color:var(--fix)">orange</b> boxes are what it corrected.</p>
    <p>Scroll to zoom and drag to move. Point at any clue to see how it was read; click it to report a mistake nobody caught.</p>`},
  {h: 'Check each change', tab: 'review', sel: ['#cardspanel'], html: () => `<p>Each card is one change the AI made. Click a card to find it on the scan, then press
      <b>✓</b> if the scan agrees or <b>✗</b> if it doesn't (and say what you see).</p>
    <p>Keyboard: <kbd>J</kbd>/<kbd>K</kbd> next or previous, <kbd>A</kbd> accept, <kbd>R</kbd> reject, <kbd>U</kbd> undo.</p>`},
  {h: 'Look over the result', tab: 'preview', sel: ['.tabs button[data-tab="preview"]'], html: () => `<p>The highlighted <b>result</b> tab (it's showing now) is the finished grid and clue list with the changes applied,
      and below them the xd file the project keeps. Changed squares and clues are shaded. A quick sanity check: does it read like a crossword?</p>`},
  {h: 'Pass judgement', sel: ['.verdict button.good', '.verdict button.bad'], html: () => `<p>When you've been through the changes, mark the puzzle <b>Looks right</b> or <b>Needs work</b>.
      Not sure? Leave it. Someone else will take a look.</p>`},
  {h: 'Add a note or a reaction', sel: ['.verdict .rx', '#vnote'], html: () => `<p>Leave a note if there's something we should know, and a reaction if a puzzle made you smile
      (😄 🧩 🕰️). Both are optional.</p>`},
  {h: "That's it. Thank you!", html: () => `<p>Every check helps. You can bring this tour back any time with the <b>? Tour</b> button at the top.
      Your work is saved as you go; sign in (top right) to keep it on any device.</p>`},
];
let tourI = 0, tourEl = null, tourAuto = false, tourBack = null;
function tourRect(st) {
  const els = (st.sel || []).map(s => document.querySelector(s)).filter(e => e && (e.offsetWidth || e.offsetHeight));
  if (!els.length) return null;
  els[0].scrollIntoView({block: 'center', inline: 'nearest'});
  const rs = els.map(e => e.getBoundingClientRect()), pad = 6;
  return {left: Math.min(...rs.map(r => r.left)) - pad, top: Math.min(...rs.map(r => r.top)) - pad,
          right: Math.max(...rs.map(r => r.right)) + pad, bottom: Math.max(...rs.map(r => r.bottom)) + pad};
}
function placeTour() {
  if (!tourEl) return;
  const hole = $('#thole'), card = $('#tcard'), r = tourRect(TOUR[tourI]), W = innerWidth, H = innerHeight;
  const cw = card.offsetWidth, ch = card.offsetHeight, clamp = (v, a, b) => Math.max(a, Math.min(v, b));
  let left, top;
  const dim = (el, x, y, w, h) => Object.assign(el.style, {left: x + 'px', top: y + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px'});
  const [dt, db, dl, dr] = ['dmt', 'dmb', 'dml', 'dmr'].map(i => document.getElementById(i));
  if (!r) {
    hole.className = 'hole none'; hole.removeAttribute('style');
    dim(dt, 0, 0, W, H); dim(db, 0, 0, 0, 0); dim(dl, 0, 0, 0, 0); dim(dr, 0, 0, 0, 0);
    left = (W - cw) / 2; top = (H - ch) / 2.4;
  } else {
    hole.className = 'hole';
    Object.assign(hole.style, {left: r.left + 'px', top: r.top + 'px', width: r.right - r.left + 'px', height: r.bottom - r.top + 'px'});
    const x0 = Math.max(0, r.left), y0 = Math.max(0, r.top), x1 = Math.min(W, r.right), y1 = Math.min(H, r.bottom);  // dim all around it
    dim(dt, 0, 0, W, y0); dim(db, 0, y1, W, H - y1); dim(dl, 0, y0, x0, y1 - y0); dim(dr, x1, y0, W - x1, y1 - y0);
    if (r.bottom + 12 + ch <= H) { top = r.bottom + 12; left = clamp(r.left, 12, W - cw - 12); }       // below it
    else if (r.top - 12 - ch >= 0) { top = r.top - 12 - ch; left = clamp(r.left, 12, W - cw - 12); }    // above it
    else if (r.right + 12 + cw <= W) { left = r.right + 12; top = clamp(r.top, 12, H - ch - 12); }      // beside it
    else { left = (W - cw) / 2; top = clamp(H - ch - 16, 12, H); }
  }
  card.style.left = Math.round(left) + 'px'; card.style.top = Math.round(top) + 'px';
}
function showTour() {
  const st = TOUR[tourI], n = TOUR.length, first = tourI === 0, last = tourI === n - 1;
  if (P && st.tab && tab !== st.tab) { tab = st.tab; renderMain(); }  // the scan and change steps show the review, the result step the result; later steps stay put
  tourEl.innerHTML = `<i class="dm" id="dmt"></i><i class="dm" id="dmb"></i><i class="dm" id="dml"></i><i class="dm" id="dmr"></i><div class="hole none" id="thole"></div><div class="tcard" id="tcard">
    <div class="step">${first || last ? 'Every Puzzle Project' : `Step ${tourI} of ${n - 2}`}</div><h2 id="tourh">${esc(st.h)}</h2>${st.html()}
    <div class="dots">${TOUR.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('')}</div>
    <div class="foot"><label><input type="checkbox" id="tourevery" ${tourWanted() ? 'checked' : ''}> Show this every time</label>
      <span class="btns">${first ? '' : '<button id="tback">Back</button>'}${last ? '' : '<button id="tskip">Skip</button>'}
      <button class="go" id="tnext">${last ? 'Done' : first ? 'Start the tour' : 'Next'}</button></span></div></div>`;
  $('#tourevery').onchange = e => tourWant(e.target.checked);
  if ($('#tback')) $('#tback').onclick = () => { tourI--; showTour(); };
  if ($('#tskip')) $('#tskip').onclick = endTour;
  $('#tnext').onclick = () => { if (last) endTour(); else { tourI++; showTour(); } };
  placeTour(); requestAnimationFrame(placeTour);
  $('#tnext').focus({preventScroll: true});
}
function tourKey(e) {
  if (!tourEl) return;
  if (e.key === 'Escape') { e.preventDefault(); endTour(); }
  else if (e.key === 'ArrowRight' && tourI < TOUR.length - 1) { e.preventDefault(); tourI++; showTour(); }
  else if (e.key === 'ArrowLeft' && tourI > 0) { e.preventDefault(); tourI--; showTour(); }
  e.stopPropagation();  // the page's own shortcuts wait until the tour is closed
}
function startTour() {
  if (tourEl) return;
  tourBack = document.activeElement;
  if (P && tab !== 'review') { tab = 'review'; renderMain(); }
  tourI = 0; window.tourOpen = true;
  tourEl = document.createElement('div'); tourEl.id = 'tour';
  tourEl.setAttribute('role', 'dialog'); tourEl.setAttribute('aria-modal', 'true'); tourEl.setAttribute('aria-labelledby', 'tourh');
  document.body.appendChild(tourEl);
  window.addEventListener('resize', placeTour); window.addEventListener('keydown', tourKey, true);
  showTour();
}
function endTour() {
  if (!tourEl) return;
  tourEl.remove(); tourEl = null; window.tourOpen = false;
  window.removeEventListener('resize', placeTour); window.removeEventListener('keydown', tourKey, true);
  if (tourBack && tourBack.focus) tourBack.focus({preventScroll: true});
}

let focusCard = null;
document.addEventListener('keydown', e => {
  if (!P || window.tourOpen || tab !== 'review' || e.target.matches?.('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const cs = [...document.querySelectorAll('.card')];
  if (!cs.length) return;
  const k = e.key.toLowerCase();
  if (k === 'enter') { e.preventDefault(); if (focusCard === null) { moveFocus(0); setCtx(true); } else setCtx(!ctxOpen); }
  else if (k === 'escape' && ctxOpen) setCtx(false);
  else if (k === 'j' || k === 'k') moveFocus(focusCard === null ? 0 : focusCard + (k === 'j' ? 1 : -1));
  else if (k === 'a' || k === 'r') { e.preventDefault(); decideCard(cs[focusCard === null ? 0 : focusCard], k === 'a' ? 'accept' : 'reject'); }
  else if (k === 'u' && focusCard !== null && cs[focusCard]) { e.preventDefault(); decideCard(cs[focusCard], 'clear'); }
});
let lastKey = '';
const renderKey = p => p.xdid + JSON.stringify([p.status, p.shown.length, Object.keys(p.review.corrections || {}).length,
                                                p.events.length, p.decisions, p.reactions]);
async function load(force) {
  const p = await API.puzzle(sel);
  const key = renderKey(p);
  const typing = document.activeElement && document.activeElement.matches('input, textarea');
  if (!force && typing) { renderList(); return; }  // don't wipe a note being typed
  if (HELPER) p.reactions = await RX.get(sel).catch(() => null);
  P = p;
  if (force || key !== lastKey) { lastKey = key; renderMain(); }
  renderList();
}
let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  try {
    S = await API.state();
    if ($('#root')) $('#root').textContent = S.root;
    if (!HELPER && $('#follow').checked || !sel) {
      const live = S.puzzles.filter(p => p.updated).sort((a, b) => b.updated - a.updated)[0];
      const vis = visible(), next = HELPER ? (pickToCheck() || vis[0])?.xdid : live ? live.xdid : vis[0]?.xdid;
      if (next !== sel) { sel = next; hot = null; focusCrops = null; }
    }
    renderList();
    if (sel) await load(false);
    if (HELPER && !tourAuto) { tourAuto = true; if (tourWanted()) startTour(); }
  } catch (e) { console.error('refresh failed', e); }
  pollTimer = setTimeout(poll, API.pollMs || 2000);
}
$('#zoom').onclick = () => $('#zoom').style.display = 'none';
window.addEventListener('blitz-refresh', () => { lastKey = ''; poll(); });  // e.g. after signing in
if (HELPER) {
  $('#h1').textContent = API.title || 'Help check old crosswords';
  $('#followl').hidden = true;
  $('#howto').innerHTML = API.howto || HOWTO; $('#howto').hidden = false;
  $('#tourbtn').hidden = false; $('#tourbtn').onclick = () => startTour();
  if (API.renderAuth) API.renderAuth($('#auth'));
}
window.onresize = () => P && redraw();
poll();
</script></body></html>
